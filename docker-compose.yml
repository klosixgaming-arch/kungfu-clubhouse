services:
  kungfu-clubhouse:
    image: nginx:1.27-alpine
    container_name: kungfu-clubhouse
    restart: unless-stopped
    ports:
      - "2244:80"          # change 2244 if that port is taken on your server
    volumes:
      - ./site:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
